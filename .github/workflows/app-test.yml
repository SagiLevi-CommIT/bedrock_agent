name: app-test

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-test.yml"
  push:
    branches: [main]
    paths:
      - "app/**"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: |
          pip install --upgrade pip wheel
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check src tests

      - name: pytest
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build (no push)
        run: docker build -f app/Dockerfile -t agent:ci .
